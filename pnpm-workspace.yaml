packages:
  - packages/*

onlyBuiltDependencies:
  - esbuild

# Single source of truth for the SignalX core version this repo builds against.
# `^X.Y.0` == `>=X.Y.0 <X.(Y+1).0` (ONE minor).
# @sigx/reactivity keeps reactive state in module-local variables, so two physical
# copies silently split core's singletons and break reactivity; the single-minor
# range forces pnpm to hoist ONE copy. Bump this one block to move the whole repo
# to a new core minor — `pnpm sync:core X.Y` does exactly that. Consumed via
# `"catalog:"` in package.json; `pnpm pack` rewrites it to the concrete range.
catalog:
  "@sigx/vite": ^0.15.0
  # Companion packages (own release lines). Not policed by verify:catalog — the
  # single-minor rule is a core-only concern — but consumed by the scaffolder:
  # scripts/gen-versions.mjs writes them into packages/cli/src/create/versions.ts
  # so every generated project pins the same set (signalxjs/cli#91).
  "@sigx/router": ^0.12.0
  "@sigx/i18n": ^0.3.0
  "@sigx/store": ^0.13.0
  "@sigx/ssg": ^0.21.0
  "@sigx/ssg-theme-daisyui": ^0.21.0
  "@sigx/daisyui": ^0.12.0
  "@sigx/terminal": ^0.12.0
  "@sigx/terminal-dev": ^0.12.0
  "@sigx/actors": ^0.9.0
  "@sigx/actors-cloudflare": ^0.9.0
