name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue builds each queued group on a temporary ref and waits for
  # the required checks to report there — without this trigger, queued PRs
  # wait forever for checks that never start.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '22']
        include:
          - os: windows-latest
            node-version: '22'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Every core dep must flow through a single-minor catalog (one hoisted
      # copy of @sigx/reactivity). Cheap static check; fails fast before build/test.
      - name: Verify catalog
        run: pnpm verify:catalog

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Scaffold real projects with the built CLI, install them from npm, and
  # typecheck + build each — the proof that generated projects work against
  # the published @sigx packages, not just that the generator's snapshots
  # match. In-repo packages a scaffold pins (@sigx/cli) come from local
  # `pnpm pack` tarballs instead, so a release PR — whose version is not on
  # npm until the tag publishes — can pass too (#118). Network + minutes,
  # so it is its own job and skipped by default locally (SIGX_E2E=1
  # enables it).
  e2e-create:
    # Already ran on the PR, and not a required check, so the queue doesn't
    # wait for it. If you make this job required, drop this guard, or queued
    # PRs wait forever.
    if: github.event_name != 'merge_group'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Scaffold, install, typecheck and build generated projects
        run: pnpm test -- e2e
        env:
          SIGX_E2E: '1'

  coverage:
    # Already ran on the PR, and not a required check, so the queue doesn't
    # wait for it. If you make this job (or a status it reports, e.g.
    # `codecov/patch`) required, drop this guard, or queued PRs wait forever.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
